name: Update Halifax 5R Screener

on:
  workflow_dispatch:
  push:
    paths:
      - 'screener.html'
      - 'scripts/update_screener.py'
      - '.github/workflows/update-screener.yml'
  schedule:
    - cron: '17 */4 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build 5R screener data
        run: python scripts/update_screener.py

      - name: Commit updated screener data
        run: |
          git config user.name "halifax-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add screener-data.json
          if git diff --cached --quiet; then
            echo "No screener data changes to commit."
          else
            git commit -m "Update Halifax 5R screener data"
            git push
          fi
