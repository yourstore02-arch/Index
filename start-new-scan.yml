name: START NEW SCAN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run Halifax 5R scan
        run: python scripts/update_screener.py

      - name: Commit updated scan results
        run: |
          git config user.name "halifax-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add screener-data.json
          if git diff --cached --quiet; then
            echo "No screener data changes to commit."
          else
            git commit -m "Update Halifax screener data"
            git push
          fi
